<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FTGM HACKS - SIM Data API</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --primary: #2563eb;
      --whatsapp: #25d366;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 580px;
    }

    /* WhatsApp Banner */
    .channel-banner {
      background: rgba(37, 211, 102, 0.1);
      border: 1px solid var(--whatsapp);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.15);
    }

    .channel-banner p {
      color: #4ade80;
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }

    .wa-btn {
      display: inline-block;
      background-color: var(--whatsapp);
      color: #052e16;
      font-weight: 700;
      padding: 10px 22px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .wa-btn:hover {
      background-color: #1ebc57;
      transform: translateY(-2px);
    }

    /* Main Card */
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      color: #fff;
      margin-bottom: 6px;
    }

    .credits {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .credits a {
      color: #60a5fa;
      text-decoration: none;
    }

    /* Form Inputs */
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #090d16;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background-color: var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    /* Output Terminal */
    pre {
      background-color: #080c14;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      color: #38bdf8;
      overflow-x: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9rem;
      max-height: 350px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Required WhatsApp Channel Link Banner -->
    <div class="channel-banner">
      <p>📢 Join Official WhatsApp Channel For Updates!</p>
      <a href="https://whatsapp.com/channel/0029Vb897RSInlqLpl2OxX37" target="_blank" class="wa-btn">
        Join Channel Now
      </a>
    </div>

    <!-- API UI -->
    <div class="card">
      <h1>SIM Data Lookup</h1>
      <div class="credits">
        Developer: <strong>FTGM HACKS</strong> | Contact: 03104882921<br>
        Source: <a href="https://ftgmdb.pages.dev" target="_blank">ftgmdb.pages.dev</a>
      </div>

      <div class="input-group">
        <input type="text" id="searchTerm" placeholder="Enter Mobile Number or CNIC..." />
        <button onclick="fetchSimData()">Search</button>
      </div>

      <pre id="output" class="hidden"></pre>
    </div>
  </div>

  <script>
    async function fetchSimData() {
      const term = document.getElementById('searchTerm').value.trim();
      const outputEl = document.getElementById('output');

      if (!term) {
        alert('Please enter a valid phone number or CNIC.');
        return;
      }

      outputEl.classList.remove('hidden');
      outputEl.textContent = 'Fetching details...';

      try {
        const response = await fetch(`/api/sim?num=${encodeURIComponent(term)}`);
        const data = await response.json();
        
        // Pretty JSON preview
        outputEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        outputEl.textContent = JSON.stringify({
          success: false,
          developer: "FTGM HACKS",
          contact: "03104882921",
          error: "Failed to connect to API endpoint.",
          details: err.message
        }, null, 2);
      }
    }
  </script>
</body>
  </html>
